<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exmplo Dom</title>
    <style>
        body{
            font-family: arial, sans-serif;
            background-color: white;
            color: black;
            transition: 0.3s;
        }
    </style>
</head>
<body>
<h1>tema escuro</h1>

<p> clique no botao abaixo para trocar o tema.</p>

    <button id= "botao-tema">
        troca tema
        </button>
    </body>


<body>
<script>
    let tema_claro= true;   //comeca com valor verdadeiro (true)

    function trocartema() {
        tema_claro = !tema_claro;   //troca de true para false e de false para true
        if (tema_claro) {
            document.body.style.backgroundColor = '#fff'; // plano de fundo branco
            document.body.style.color = '#222'; // cor do texto preta

        } else { //senao, se é tema escuro

            document.body.style.backgroundColor = '#222';// cor fundo
            document.body.style.color = '#fff';// cor do texto branco
        }
    }
        document.getElementById('botao-tema').addEventListener('click', trocartema);
</script>
</body>
</html>

<body>
<p> use o botao a baixo para abrir a imagem </p>
<button id = "toggle"></button>
<br/>
<br/>
<img alt="cravo flor " id="imagem" src="https://casadeflores.com.br/wp-content/uploads/2022/06/IMG_3666.jpeg">
</body>
<script>
    let button = document.getElementById('toggle');

    function toggleHide() {
        //seleciona a imagem usando seu id
        let imagem = document.getElementById('imagem' );
        if (imagem.style.display === 'none') {
            imagem.style.display = 'block';// mostra imagem
            button.textContent = 'esconder';// trocar texto do botao
        }else{ // se a imagem estiver visivel
            imagem.style.display = 'none'; // esconder a imagem
            button.textContent = 'Mostrar'; // troca o texto do botao

        }
    }
        button.addEventListener('click', toggleHide);

    </script>
